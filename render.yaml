services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: hackmatrix-backend
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_POOLED
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # -------------------------------------------------------------
  # 2. Next.js Frontend Web Service
  # -------------------------------------------------------------
  - type: web
    name: hackmatrix-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: hackmatrix-backend
          property: host
      - key: BACKEND_URL
        fromService:
          type: web
          name: hackmatrix-backend
          property: host
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        value: pk_test_Y2FyaW5nLXBvbGxpd29nLTQxMC5jbGVyay5hY2NvdW50cy5kZXYk
      - key: CLERK_SECRET_KEY
